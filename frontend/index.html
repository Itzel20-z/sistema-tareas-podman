<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sistema de Tareas</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>📋 Sistema de Tareas</h1>
  </header>

  <main>
    <section class="formulario">
      <h2 id="form-titulo">Nueva tarea</h2>
      <form id="tarea-form">
        <input type="hidden" id="tarea-id" />

        <label for="titulo">Título *</label>
        <input type="text" id="titulo" required maxlength="150" />

        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" rows="3"></textarea>

        <label for="estado">Estado</label>
        <select id="estado">
          <option value="pendiente">Pendiente</option>
          <option value="en_proceso">En proceso</option>
          <option value="completada">Completada</option>
        </select>

        <label for="prioridad">Prioridad</label>
        <select id="prioridad">
          <option value="baja">Baja</option>
          <option value="media" selected>Media</option>
          <option value="alta">Alta</option>
        </select>

        <label for="fecha_limite">Fecha límite</label>
        <input type="date" id="fecha_limite" />

        <div class="botones">
          <button type="submit" id="btn-guardar">Guardar tarea</button>
          <button type="button" id="btn-cancelar" style="display:none;">Cancelar edición</button>
        </div>
      </form>
    </section>

    <section class="lista">
      <div class="filtros">
        <h2>Tareas</h2>
        <select id="filtro-estado">
          <option value="">Todos los estados</option>
          <option value="pendiente">Pendiente</option>
          <option value="en_proceso">En proceso</option>
          <option value="completada">Completada</option>
        </select>
      </div>
      <div id="mensaje" class="mensaje"></div>
      <table id="tabla-tareas">
        <thead>
          <tr>
            <th>Título</th>
            <th>Estado</th>
            <th>Prioridad</th>
            <th>Fecha límite</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tareas-body"></tbody>
      </table>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
