version: "3.8"

services:
  db:
    image: docker.io/postgres:16-alpine
    container_name: tareas-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tareas_db
    volumes:
      - tareas-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ../backend
      dockerfile: Containerfile
    container_name: tareas-backend
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: tareas_db
    depends_on:
      - db
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Containerfile
    container_name: tareas-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  tareas-db-data:
